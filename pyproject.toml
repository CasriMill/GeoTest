[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geotest"
version = "0.1.0"
description = "Printable hex-grid geography tests for ATC training"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["shapely>=2.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
